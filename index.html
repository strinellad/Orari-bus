  .dirbar{

};

const SCHOOL_YEAR = { start: "2026-09-16", end: "2027-06-09" };
const SCHOOL_BREAKS = [["2026-12-07","2026-12-07"], ["2026-12-23","2027-01-06"], ["2027-03-25","2027-03-30"]];
const HOLIDAYS = ["2026-10-04","2026-11-01","2026-12-08","2026-12-25","2026-12-26","2027-01-01","2027-01-06","2027-03-28","2027-03-29","2027-04-25","2027-05-01","2027-06-02"];

function pad(n){ return String(n).padStart(2,"0"); }
function dateStr(d){ return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function addDays(d,n){ const r=new Date(d); r.setDate(r.getDate()+n); return r; }
function toMinutes(hhmm){ const [h,m]=hhmm.split(":").map(Number); return h*60+m; }

let scolasticoOverride = null;

function getDayInfo(date){
  const ds = dateStr(date);
  const dow = date.getDay();
  const isHoliday = dow===0 || HOLIDAYS.includes(ds);
  let isScolastico = false;
  if(!isHoliday){
    if(scolasticoOverride !== null) isScolastico = scolasticoOverride;
    else {
      const inYear = ds>=SCHOOL_YEAR.start && ds<=SCHOOL_YEAR.end;
      const inBreak = SCHOOL_BREAKS.some(([s,e])=> ds>=s && ds<=e);
      isScolastico = inYear && !inBreak;
    }
  }
  return {ds, dow, isHoliday, isScolastico};
}

function loadOverride(){
  try {
    const r = localStorage.getItem('scolastico-override');
    if(r) scolasticoOverride = r==="si" ? true : (r==="no" ? false : null);
  } catch(e){}
  renderCalBar(); renderAll();
}

function setOverride(v){
  scolasticoOverride = v==="si" ? true : (v==="no" ? false : null);
  renderCalBar(); renderAll();
  try { localStorage.setItem('scolastico-override', v); } catch(e){}
}

function renderCalBar(){
  const bar = document.getElementById("calBar");
  const cur = scolasticoOverride===true ? "si" : (scolasticoOverride===false ? "no" : "auto");
  bar.querySelectorAll(".calopt").forEach(el=>{ el.classList.toggle("active", el.dataset.v===cur); });
}

function tripVisible(trip, dayInfo){
  if(dayInfo.isHoliday) return false;
  let base = trip.tipo==="FA" ? true : (trip.tipo==="FS" ? dayInfo.isScolastico : !dayInfo.isScolastico);
  if(!base) return false;
  return trip.giorno ? trip.giorno(dayInfo.dow) : true;
}

let state = { route: "demetrio", dir: "toAQ", viewedDate: new Date() };
const WD = ["domenica","lunedì","martedì","mercoledì","giovedì","venerdì","sabato"];
const MO = ["gen","feb","mar","apr","mag","giu","lug","ago","set","ott","nov","dic"];

let map = null, depMarker = null, arrMarker = null, userMarker = null, watchGpsId = null;

function getRouteCoords() {
  let dep, arr;
  if (state.route === "ocre") {
    dep = state.dir === "toAQ" ? STOPS_COORDS.ocre : STOPS_COORDS.laquila;
    arr = state.dir === "toAQ" ? STOPS_COORDS.laquila : STOPS_COORDS.ocre;
  } else {
    dep = state.dir === "toAQ" ? STOPS_COORDS.demetrio : STOPS_COORDS.laquila;
    arr = state.dir === "toAQ" ? STOPS_COORDS.laquila : STOPS_COORDS.demetrio;
  }
  return { dep, arr };
}

function createDivIcon(className, text) {
  return L.divIcon({ className: 'custom-div-icon', html: `<div class="map-pin ${className}">${text}</div>`, iconSize: [26, 26], iconAnchor: [13, 13] });
}

function initMap() {
  if (map) return;
  map = L.map('map', { zoomControl: false }).setView([42.31, 13.45], 11);
  L.control.zoom({ position: 'bottomright' }).addTo(map);

  // Mappa standard OpenStreetMap - Completamente gratuita, NO API KEY
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; OpenStreetMap contributors'
  }).addTo(map);

  updateMapMarkers();
  requestGpsPermission(false);
}

function updateMapMarkers() {
  if (!map) return;
  const { dep, arr } = getRouteCoords();
  document.getElementById('mapTitle').textContent = `🗺️ ${dep.label.split(' ')[0]} ➔ ${arr.label.split(' ')[0]}`;

  if (depMarker) depMarker.setLatLng([dep.lat, dep.lng]);
  else depMarker = L.marker([dep.lat, dep.lng], { icon: createDivIcon('pin-dep', 'P') }).addTo(map);

  if (arrMarker) arrMarker.setLatLng([arr.lat, arr.lng]);
  else arrMarker = L.marker([arr.lat, arr.lng], { icon: createDivIcon('pin-arr', 'A') }).addTo(map);

  fitMapBounds();
}

function fitMapBounds() {
  if (!map) return;
  const points = [];
  if (depMarker) points.push(depMarker.getLatLng());
  if (arrMarker) points.push(arrMarker.getLatLng());
  if (userMarker) points.push(userMarker.getLatLng());
  if (points.length > 0) map.fitBounds(L.latLngBounds(points), { padding: [35, 35] });
}

function requestGpsPermission(userTriggered = false) {
  const badge = document.getElementById('locStatusBadge');
  if (!navigator.geolocation) {
    badge.textContent = "GPS assente";
    return;
  }

  badge.textContent = "Ricerca GPS...";

  navigator.geolocation.getCurrentPosition(
    pos => {
      badge.textContent = "GPS Attivo";
      badge.style.color = "var(--green)";
      updateUserLocation(pos);
      startContinuousTracking();
      if (userTriggered) map.setView([pos.coords.latitude, pos.coords.longitude], 15);
    },
    err => {
      badge.textContent = "Servono permessi GPS";
      badge.style.color = "var(--danger)";
    },
    { enableHighAccuracy: true, timeout: 10000 }
  );
}

function startContinuousTracking() {
  if (watchGpsId !== null) navigator.geolocation.clearWatch(watchGpsId);
  watchGpsId = navigator.geolocation.watchPosition(
    updateUserLocation,
    err => console.warn(err),
    { enableHighAccuracy: true, timeout: 10000, maximumAge: 1000 }
  );
}

function updateUserLocation(pos) {
  const userCoords = [pos.coords.latitude, pos.coords.longitude];
  if (userMarker) userMarker.setLatLng(userCoords);
  else {
    userMarker = L.marker(userCoords, {
      icon: L.divIcon({ className: 'custom-div-icon', html: `<div class="map-pin pin-user"></div>`, iconSize: [18, 18], iconAnchor: [9, 9] })
    }).addTo(map);
    fitMapBounds();
  }
}

function renderTabs(){
  const routeTabs = document.getElementById("routeTabs"); routeTabs.innerHTML = "";
  Object.entries(ROUTES).forEach(([key,r])=>{
    const el = document.createElement("div");
    el.className = "tab" + (state.route===key ? " active":""); el.textContent = r.label;
    el.onclick = ()=>{ state.route=key; state.dir="toAQ"; renderAll(); updateMapMarkers(); };
    routeTabs.appendChild(el);
  });

  const dirTabs = document.getElementById("dirTabs"); dirTabs.innerHTML = "";
  Object.entries(ROUTES[state.route].directions).forEach(([key,d])=>{
    const el = document.createElement("div");
    el.className = "dirbtn" + (state.dir===key ? " active":""); el.textContent = d.label;
    el.onclick = ()=>{ state.dir=key; renderAll(); updateMapMarkers(); };
    dirTabs.appendChild(el);
  });
}

function renderClockAndChip(){
  const now = new Date();
  document.getElementById("clock").textContent = `${pad(now.getHours())}:${pad(now.getMinutes())}`;
  const info = getDayInfo(state.viewedDate);
  const chip = document.getElementById("daychip");
  chip.className = "daychip " + (info.isHoliday ? "festivo" : (info.isScolastico ? "scolastico" : "nonscolastico"));
  document.getElementById("daychipText").innerHTML = `<b>${(dateStr(state.viewedDate)===dateStr(now)?"oggi, ":"")+WD[info.dow]} ${state.viewedDate.getDate()}</b> — ` + (info.isHoliday?"festivo":(info.isScolastico?"scolastico":"feriale, no scuola"));
}

function tripsSorted(trips){ return [...trips].sort((a,b)=> toMinutes(a.p)-toMinutes(b.p)); }

function findNextDeparture(){
  const trips = tripsSorted(ROUTES[state.route].directions[state.dir].trips);
  const now = new Date();
  for(let d=0; d<14; d++){
    const date = addDays(now, d); const info = getDayInfo(date);
    if(info.isHoliday) continue;
    for(const trip of trips){
      if(!tripVisible(trip, info)) continue;
      const dep = new Date(date.getFullYear(), date.getMonth(), date.getDate(), ...trip.p.split(":").map(Number));
      if(d===0 && dep<=now) continue;
      return {trip, date, dep};
    }
  }
  return null;
}

function renderNextCard(){
  const card = document.getElementById("nextCard");
  const found = findNextDeparture();
  if(!found){ card.innerHTML = `<div class="next-label">Prossima corsa</div><div>Nessuna corsa nei prossimi 14 giorni.</div>`; return; }
  const {trip, date, dep} = found; const now = new Date();
  const diffMin = Math.round((dep-now)/60000);
  const when = dateStr(date)===dateStr(now) ? (diffMin<60 ? `tra ${diffMin} min` : `tra ${Math.floor(diffMin/60)}h ${diffMin%60}m`) : `${WD[date.getDay()]} ${date.getDate()} ${MO[date.getMonth()]}, ore ${trip.p}`;
  card.innerHTML = `
    <div class="next-label">Prossima corsa</div>
    <div class="next-main">
      <div class="roundel" style="background:${LINE_COLORS[trip.linea]||'#888'}">${trip.linea}</div>
      <div class="next-times">${trip.p} <small>→</small> ${trip.a}</div>
    </div>
    <div class="next-sub">linea ${trip.nome}</div>
    <div class="next-when">${when}</div>
  `;
}

function renderTripList(){
  const container = document.getElementById("tripList"); container.innerHTML = "";
  const dirInfo = ROUTES[state.route].directions[state.dir];
  const trips = tripsSorted(dirInfo.trips);
  const info = getDayInfo(state.viewedDate);

  if(info.isHoliday){ container.innerHTML = `<div style="padding:10px; color:var(--text-dim);">Nessuna corsa nei giorni festivi.</div>`; return; }

  const now = new Date();
  trips.forEach(trip => {
    if(!tripVisible(trip, info)) return;
    const isPassed = dateStr(state.viewedDate)===dateStr(now) && toMinutes(trip.p) < (now.getHours()*60+now.getMinutes());
    const el = document.createElement("div");
    el.className = "trip" + (isPassed ? " passed" : "");
    el.innerHTML = `
      <div class="roundel-sm" style="background:${LINE_COLORS[trip.linea]||'#888'}">${trip.linea}</div>
      <div class="trip-times">${trip.p}<span class="arrow">→</span>${trip.a}</div>
      <div class="trip-meta"><div style="font-size:13px; font-weight:600;">${trip.nome}</div></div>
      <div class="badge ${trip.tipo.toLowerCase()}">${trip.tipo}</div>
    `;
    container.appendChild(el);
  });
}

function renderAll(){
  renderTabs(); renderClockAndChip(); renderNextCard(); renderTripList();
  document.getElementById("dateLabel").textContent = dateStr(state.viewedDate)===dateStr(new Date()) ? "oggi" : `${state.viewedDate.getDate()} ${MO[state.viewedDate.getMonth()]}`;
}

document.getElementById("prevDay").onclick = ()=>{ state.viewedDate = addDays(state.viewedDate, -1); renderAll(); };
document.getElementById("nextDay").onclick = ()=>{ state.viewedDate = addDays(state.viewedDate, 1); renderAll(); };
document.getElementById("calBar").querySelectorAll(".calopt").forEach(el=>{ el.onclick = ()=> setOverride(el.dataset.v); });

setInterval(renderClockAndChip, 30000);
renderAll(); loadOverride(); initMap();
</script>
</body>
</html>
