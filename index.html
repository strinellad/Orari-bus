<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Orari Bus L'Aquila - San Demetrio & San Panfilo</title>
  <link rel="manifest" href="manifest.json">
  <style>
    :root {
      --bg-color: #12181f;
      --card-bg: #1e2630;
      --accent: #ff5722;
      --accent-blue: #2196f3;
      --text: #ffffff;
      --text-dim: #a0aec0;
      --success: #4caf50;
      --tag-fa: #2e7d32;
      --tag-fs: #1565c0;
      --tag-fns: #ef6c00;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text);
      margin: 0;
      padding: 12px;
      padding-bottom: 40px;
    }

    h1 {
      font-size: 1.3rem;
      text-align: center;
      margin: 8px 0 16px 0;
    }

    /* Banner RSS Notifiche */
    #rss-banner {
      display: none;
      background-color: #2a1b4e;
      border-left: 4px solid var(--accent);
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 16px;
      font-size: 0.85rem;
    }

    #rss-banner h3 {
      margin: 0 0 4px 0;
      font-size: 0.9rem;
      color: #ff9800;
    }

    /* Controllo GPS Alert */
    .gps-box {
      background: var(--card-bg);
      border: 1px solid #2d3748;
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 16px;
      text-align: center;
    }

    .btn-alert {
      background: var(--accent);
      color: white;
      border: none;
      padding: 10px 14px;
      border-radius: 6px;
      font-weight: bold;
      width: 100%;
      cursor: pointer;
      font-size: 0.9rem;
    }

    .btn-alert.active {
      background: var(--success);
    }

    /* Titoli Sezione */
    .main-title {
      font-size: 1.1rem;
      font-weight: bold;
      color: #ffffff;
      background: #2d3748;
      padding: 8px 12px;
      border-radius: 6px;
      margin-top: 20px;
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .sub-title {
      font-size: 0.95rem;
      color: var(--accent-blue);
      border-bottom: 1px solid var(--accent-blue);
      padding-bottom: 4px;
      margin: 14px 0 8px 0;
      font-weight: bold;
    }

    /* Schede e Orari */
    .bus-card {
      background: var(--card-bg);
      border-radius: 8px;
      padding: 10px 12px;
      margin-top: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-left: 3px solid var(--accent-blue);
    }

    .bus-card.sd {
      border-left-color: var(--accent);
    }

    .bus-time {
      font-size: 1.25rem;
      font-weight: bold;
    }

    .bus-arr {
      font-size: 0.8rem;
      color: var(--text-dim);
    }

    .bus-info {
      text-align: right;
    }

    .bus-line {
      font-size: 0.8rem;
      font-weight: bold;
      color: #e2e8f0;
    }

    .tags {
      display: flex;
      gap: 4px;
      justify-content: flex-end;
      margin-top: 4px;
    }

    .tag {
      font-size: 0.7rem;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: bold;
      color: white;
    }

    .tag-fa { background: var(--tag-fa); }
    .tag-fs { background: var(--tag-fs); }
    .tag-fns { background: var(--tag-fns); }
  </style>
</head>

    function renderList(listId, items, isSanDemetrio) {
      const container = document.getElementById(listId);
      container.innerHTML = items.map(item => {
        let tagClass = "tag-fa";
        if (item.val.includes("FS")) tagClass = "tag-fs";
        if (item.val.includes("FNS")) tagClass = "tag-fns";

        return `
          <div class="bus-card ${isSanDemetrio ? 'sd' : ''}">
            <div>
              <div class="bus-time">${item.dep}</div>
              <div class="bus-arr">Arr. ${item.arr}</div>
            </div>
            <div class="bus-info">
              <div class="bus-line">Linea ${item.line} • ${item.note}</div>
              <div class="tags">
                <span class="tag ${tagClass}">${item.val}</span>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    // Rendering iniziale di tutti i dati
    renderList('list-aq-sd', data.aq_sd, true);
    renderList('list-aq-sp', data.aq_sp, false);
    renderList('list-sd-aq', data.sd_aq, true);
    renderList('list-sp-aq', data.sp_aq, false);

    // --- 1. CARICAMENTO FEED RSS TUA ---
    async function checkTUANews() {
      const rssUrl = encodeURIComponent('https://www.tuabruzzo.it/rss.xml');
      const apiUrl = `https://api.rss2json.com/v1/api.json?rss_url=${rssUrl}`;

      try {
        const response = await fetch(apiUrl);
        const resData = await response.json();
        
        if (resData.status === 'ok') {
          const keywords = ["aquila", "san demetrio", "san panfilo", "ocre", "strinella", "2001", "2007", "2059"];
          const relevantItems = resData.items.filter(item => {
            const text = (item.title + ' ' + item.description).toLowerCase();
            return keywords.some(kw => text.includes(kw));
          });

          if (relevantItems.length > 0) {
            const banner = document.getElementById('rss-banner');
            const content = document.getElementById('rss-content');
            content.innerHTML = `<strong>${relevantItems[0].title}</strong><br>${relevantItems[0].description.substring(0, 130)}...`;
            banner.style.display = 'block';
          }
        }
      } catch (err) {
        console.log("Feed RSS non raggiungibile:", err);
      }
    }

    // --- 2. GEOLOCALIZZAZIONE ED ALLERTA FERMATE ---
    const TARGET_STOPS = [
      { name: "San Demetrio Uff. Postale", lat: 42.2905, lon: 13.5855 },
      { name: "San Panfilo d'Ocre", lat: 42.2882, lon: 13.6015 }
    ];

    let watchId = null;

    function toggleGPSAlert() {
      const btn = document.getElementById('alertBtn');
      const status = document.getElementById('gps-status');

      if (watchId !== null) {
        navigator.geolocation.clearWatch(watchId);
        watchId = null;
        btn.classList.remove('active');
        btn.innerText = "🔔 Attiva Allarme Arrivo (San Demetrio / San Panfilo)";
        status.innerText = "GPS disattivato";
        return;
      }

      if ("Notification" in window && Notification.permission !== "granted") {
        Notification.requestPermission();
      }

      if ("geolocation" in navigator) {
        btn.classList.add('active');
        btn.innerText = "🛑 Disattiva Allarme GPS";
        status.innerText = "GPS attivo: monitoraggio posizione...";

        watchId = navigator.geolocation.watchPosition(
          position => {
            const userLat = position.coords.latitude;
            const userLon = position.coords.longitude;

            TARGET_STOPS.forEach(stop => {
              const distance = getDistanceMetres(userLat, userLon, stop.lat, stop.lon);
              status.innerText = `Distanza da ${stop.name}: ${Math.round(distance)}m`;

              if (distance < 300) {
                triggerArrivalNotification(stop.name);
              }
            });
          },
          error => { status.innerText = "Errore durante la lettura del GPS."; },
          { enableHighAccuracy: true }
        );
      } else {
        alert("Geolocalizzazione non supportata dal browser.");
      }
    }

    function getDistanceMetres(lat1, lon1, lat2, lon2) {
      const R = 6371e3;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLon / 2) * Math.sin(dLon / 2);
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }

    function triggerArrivalNotification(stopName) {
      if ("vibrate" in navigator) navigator.vibrate([500, 200, 500]);
      if ("Notification" in window && Notification.permission === "granted") {
        new Notification("⚠️ Sei in arrivo!", {
          body: `Ti stai avvicinando alla fermata di ${stopName}!`,
          icon: "https://cdn-icons-png.flaticon.com/512/3448/3448339.png"
        });
      }
    }

    // --- SERVICE WORKER ---
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }

    checkTUANews();
