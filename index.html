<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Orari Bus L'Aquila</title>
  <link rel="manifest" href="manifest.json">
  
  <!-- Mappa Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    :root {
      --bg-color: #12181f;
      --card-bg: #1e2630;
      --accent: #ff5722;
      --accent-blue: #2196f3;
      --text: #ffffff;
      --text-dim: #a0aec0;
      --success: #4caf50;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text);
      margin: 0;
      padding: 12px;
      padding-bottom: 30px;
    }

    /* Banner RSS */
    #rss-banner {
      display: none;
      background-color: #2a1b4e;
      border-left: 4px solid var(--accent);
      padding: 10px 12px;
      border-radius: 8px;
      margin-bottom: 12px;
      font-size: 0.85rem;
    }
    #rss-banner h3 { margin: 0 0 4px 0; color: #ff9800; font-size: 0.9rem; }

    /* Mappa */
    #map {
      height: 200px;
      width: 100%;
      border-radius: 10px;
      margin-bottom: 12px;
      border: 1px solid #2d3748;
    }

    /* Allerta GPS */
    .gps-box {
      background: var(--card-bg);
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 14px;
      text-align: center;
    }
    .btn-alert {
      background: var(--accent);
      color: white;
      border: none;
      padding: 8px 12px;
      border-radius: 6px;
      font-weight: bold;
      width: 100%;
      cursor: pointer;
    }
    .btn-alert.active { background: var(--success); }

    /* Navigazione a Schede (Andata / Ritorno) */
    .nav-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
    }
    .tab-btn {
      flex: 1;
      padding: 10px;
      background: var(--card-bg);
      color: var(--text-dim);
      border: 1px solid #2d3748;
      border-radius: 6px;
      font-weight: bold;
      font-size: 0.85rem;
      cursor: pointer;
    }
    .tab-btn.active {
      background: var(--accent-blue);
      color: white;
      border-color: var(--accent-blue);
    }

    /* Filtri Destinazione */
    .filter-bar {
      display: flex;
      gap: 6px;
      margin-bottom: 12px;
    }
    .filter-chip {
      padding: 6px 12px;
      background: #2d3748;
      border-radius: 16px;
      font-size: 0.75rem;
      color: var(--text-dim);
      cursor: pointer;
      border: none;
    }
    .filter-chip.active {
      background: var(--accent);
      color: white;
    }

    /* Lista Corsa */
    .bus-card {
      background: var(--card-bg);
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-left: 4px solid var(--accent-blue);
    }
    .bus-card.sd { border-left-color: var(--accent); }

    .bus-time { font-size: 1.2rem; font-weight: bold; }
    .bus-arr { font-size: 0.75rem; color: var(--text-dim); }
    .bus-dest { font-size: 0.85rem; font-weight: bold; }
    .bus-sub { font-size: 0.75rem; color: var(--text-dim); }
    .tag {
      font-size: 0.7rem;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: bold;
      background: #2d3748;
      color: #e2e8f0;
      display: inline-block;
      margin-top: 4px;
    }
  </style>
</head>
<body>

  <!-- Banner Avvisi TUA -->
  <div id="rss-banner">
    <h3>⚠️ Avviso TUA Abruzzo</h3>
    <div id="rss-content">Caricamento...</div>
  </div>

  <!-- Mappa Interattiva -->
  <div id="map"></div>

  <!-- Controllo GPS -->
  <div class="gps-box">
    <button id="alertBtn" class="btn-alert" onclick="toggleGPSAlert()">
      🔔 Attiva Allarme Arrivo (San Demetrio / San Panfilo)
    </button>
    <div id="gps-status" style="font-size: 0.75rem; margin-top: 4px; color: var(--text-dim);">GPS non attivo</div>
  </div>

  <!-- Schede Direzione (Andata da L'Aquila per Prima) -->
  <div class="nav-tabs">
    <button class="tab-btn active" id="tab-andata" onclick="setDirection('andata')">1. DA L'AQUILA ➔</button>
    <button class="tab-btn" id="tab-ritorno" onclick="setDirection('ritorno')">2. PER L'AQUILA ➔</button>
  </div>

  <!-- Filtro Fermata -->
  <div class="filter-bar">
    <button class="filter-chip active" onclick="setFilter('all', this)">Tutti</button>
    <button class="filter-chip" onclick="setFilter('sd', this)">San Demetrio</button>
    <button class="filter-chip" onclick="setFilter('sp', this)">San Panfilo</button>
  </div>

  <!-- Contenitore Lista Orari -->
  <div id="bus-list"></div>

  <!-- Mappa Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    // --- 1. DATI ORARI DA PDF ---
    const scheduleData = [
      // DA L'AQUILA (ANDATA)
      { dir: 'andata', stop: 'sp', dep: '06:00', arr: '06:21', line: '2007', val: 'FA', note: 'AVEZZANO-ROCCA DI MEZZO' },
      { dir: 'andata', stop: 'sp', dep: '06:45', arr: '07:06', line: '2007', val: 'FA', note: 'AVEZZANO-ROCCA DI MEZZO' },
      { dir: 'andata', stop: 'sd', dep: '07:50', arr: '08:28', line: '2001', val: 'FNS', note: 'BOMINACO' },
      { dir: 'andata', stop: 'sd', dep: '08:00', arr: '08:17', line: '2059', val: 'FS', note: 'SECINARO-GORIANO' },
      { dir: 'andata', stop: 'sd', dep: '08:00', arr: '08:25', line: '2001', val: 'FS', note: 'BOMINACO' },
      { dir: 'andata', stop: 'sd', dep: '08:00', arr: '08:25', line: '2059', val: 'FNS', note: 'SECINARO-GORIANO' },
      { dir: 'andata', stop: 'sd', dep: '08:00', arr: '08:40', line: '2064', val: 'FS', note: 'SAN DEMETRIO-TUSSILLO' },
      { dir: 'andata', stop: 'sp', dep: '08:10', arr: '08:31', line: '2007', val: 'FA', note: 'AVEZZANO-ROCCA DI MEZZO' },
      { dir: 'andata', stop: 'sd', dep: '10:15', arr: '10:38', line: '2001', val: 'FS', note: 'BOMINACO' },
      { dir: 'andata', stop: 'sp', dep: '11:10', arr: '11:31', line: '2007', val: 'FS / FNS', note: 'AVEZZANO-ROCCA DI MEZZO' },
      { dir: 'andata', stop: 'sd', dep: '11:40', arr: '12:09', line: '2046', val: 'FA', note: 'S. BENEDETTO IN P.' },
      { dir: 'andata', stop: 'sd', dep: '12:10', arr: '12:27', line: '2059', val: 'FA', note: 'SECINARO-GORIANO' },
      { dir: 'andata', stop: 'sd', dep: '12:20', arr: '13:02', line: '2001', val: 'FS', note: 'BOMINACO' },
      { dir: 'andata', stop: 'sp', dep: '13:15', arr: '13:36', line: '2007', val: 'FS / FNS', note: 'AVEZZANO-ROCCA DI MEZZO' },
      { dir: 'andata', stop: 'sd', dep: '13:40', arr: '14:20', line: '2064', val: 'FS / FNS', note: 'SAN DEMETRIO-TUSSILLO' },
      { dir: 'andata', stop: 'sp', dep: '13:55', arr: '14:16', line: '2007', val: 'FA', note: 'AVEZZANO-ROCCA DI MEZZO' },
      { dir: 'andata', stop: 'sd', dep: '14:05', arr: '14:28', line: '2005', val: 'FA', note: 'ATELETA-SULMONA' },
      { dir: 'andata', stop: 'sd', dep: '14:10', arr: '14:48', line: '2001', val: 'FA', note: 'BOMINACO' },
      { dir: 'andata', stop: 'sp', dep: '16:15', arr: '16:36', line: '2007', val: 'FS', note: 'AVEZZANO-ROCCA DI MEZZO' },
      { dir: 'andata', stop: 'sd', dep: '16:40', arr: '17:05', line: '2001', val: 'FA', note: 'BOMINACO' },
      { dir: 'andata', stop: 'sd', dep: '17:00', arr: '17:21', line: '2059', val: 'FA', note: 'SECINARO-GORIANO' },
      { dir: 'andata', stop: 'sp', dep: '17:35', arr: '17:56', line: '2007', val: 'FA', note: 'AVEZZANO-ROCCA DI MEZZO' },
      { dir: 'andata', stop: 'sd', dep: '19:00', arr: '19:23', line: '2046', val: 'FA', note: 'S. BENEDETTO IN P.' },
      { dir: 'andata', stop: 'sd', dep: '19:15', arr: '19:55', line: '2064', val: 'FA', note: 'SAN DEMETRIO-TUSSILLO' },
      { dir: 'andata', stop: 'sp', dep: '19:45', arr: '20:06', line: '2007', val: 'FA', note: 'AVEZZANO-ROCCA DI MEZZO' },

      // PER L'AQUILA (RITORNO)
      { dir: 'ritorno', stop: 'sd', dep: '07:09', arr: '07:50', line: '2064', val: 'FS', note: 'SAN DEMETRIO-TUSSILLO' },
      { dir: 'ritorno', stop: 'sd', dep: '07:11', arr: '07:39', line: '2059', val: 'FS / FNS', note: 'SECINARO-GORIANO' },
      { dir: 'ritorno', stop: 'sp', dep: '07:20', arr: '07:45', line: '2007', val: 'FA', note: 'AVEZZANO-ROCCA DI MEZZO' },
      { dir: 'ritorno', stop: 'sd', dep: '07:25', arr: '07:50', line: '2001', val: 'FA', note: 'BOMINACO' },
      { dir: 'ritorno', stop: 'sd', dep: '07:33', arr: '07:55', line: '2005', val: 'FA', note: 'ATELETA-SULMONA' },
      { dir: 'ritorno', stop: 'sp', dep: '08:20', arr: '08:45', line: '2007', val: 'FS / FNS', note: 'AVEZZANO-ROCCA DI MEZZO' },
      { dir: 'ritorno', stop: 'sd', dep: '08:30', arr: '08:55', line: '2059', val: 'FNS', note: 'SECINARO-GORIANO' },
      { dir: 'ritorno', stop: 'sd', dep: '08:40', arr: '09:00', line: '2064', val: 'FS', note: 'Arr. L\'Aquila Cimitero' },
      { dir: 'ritorno', stop: 'sp', dep: '09:35', arr: '10:00', line: '2007', val: 'FS / FNS', note: 'AVEZZANO-ROCCA DI MEZZO' },
      { dir: 'ritorno', stop: 'sd', dep: '09:45', arr: '10:10', line: '2001', val: 'FA', note: 'BOMINACO' },
      { dir: 'ritorno', stop: 'sd', dep: '09:58', arr: '10:25', line: '2059', val: 'FA', note: 'SECINARO-GORIANO' },
      { dir: 'ritorno', stop: 'sd', dep: '11:31', arr: '11:55', line: '2001', val: 'FS', note: 'BOMINACO' },
      { dir: 'ritorno', stop: 'sp', dep: '12:45', arr: '13:10', line: '2007', val: 'FA', note: 'AVEZZANO-ROCCA DI MEZZO' },
      { dir: 'ritorno', stop: 'sd', dep: '13:25', arr: '13:50', line: '2001', val: 'FS', note: 'BOMINACO' },
      { dir: 'ritorno', stop: 'sd', dep: '13:35', arr: '14:00', line: '2059', val: 'FA', note: 'SECINARO-GORIANO' },
      { dir: 'ritorno', stop: 'sp', dep: '14:09', arr: '14:40', line: '2007', val: 'FA', note: 'AVEZZANO-ROCCA DI MEZZO' },
      { dir: 'ritorno', stop: 'sp', dep: '15:24', arr: '15:50', line: '2007', val: 'FS (Tranne Mar) / FNS', note: 'AVEZZANO-ROCCA DI MEZZO' },
      { dir: 'ritorno', stop: 'sp', dep: '15:29', arr: '15:55', line: '2007', val: 'FS (Solo Martedì)', note: 'AVEZZANO-ROCCA DI MEZZO' },
      { dir: 'ritorno', stop: 'sd', dep: '15:32', arr: '16:00', line: '2008', val: 'FA', note: 'CASTELVECCHIO CALVISIO' },
      { dir: 'ritorno', stop: 'sd', dep: '16:19', arr: '16:50', line: '2059', val: 'FA', note: 'SECINARO-GORIANO' },
      { dir: 'ritorno', stop: 'sd', dep: '16:20', arr: '16:45', line: '2046', val: 'FA', note: 'S. BENEDETTO IN P.' },
      { dir: 'ritorno', stop: 'sd', dep: '17:20', arr: '17:50', line: '2064', val: 'FA', note: 'SAN DEMETRIO-TUSSILLO' },
      { dir: 'ritorno', stop: 'sp', dep: '17:44', arr: '18:15', line: '2007', val: 'FS', note: 'AVEZZANO-ROCCA DI MEZZO' },
      { dir: 'ritorno', stop: 'sd', dep: '18:25', arr: '18:50', line: '2001', val: 'FA', note: 'BOMINACO' },
      { dir: 'ritorno', stop: 'sp', dep: '19:10', arr: '19:35', line: '2007', val: 'FA', note: 'AVEZZANO-ROCCA DI MEZZO' },
      { dir: 'ritorno', stop: 'sp', dep: '20:59', arr: '21:25', line: '2007', val: 'FA', note: 'AVEZZANO-ROCCA DI MEZZO' }
    ];

    let currentDir = 'andata';
    let currentFilter = 'all';

    function renderList() {
      const container = document.getElementById('bus-list');
      const filtered = scheduleData.filter(item => {
        const matchDir = item.dir === currentDir;
        const matchStop = currentFilter === 'all' || item.stop === currentFilter;
        return matchDir && matchStop;
      });

      if(filtered.length === 0) {
        container.innerHTML = `<div style="text-align:center; padding: 20px; color: var(--text-dim);">Nessun bus trovato per i filtri selezionati.</div>`;
        return;
      }

      container.innerHTML = filtered.map(item => `
        <div class="bus-card ${item.stop === 'sd' ? 'sd' : ''}">
          <div>
            <div class="bus-time">${item.dep}</div>
            <div class="bus-arr">Arr. ${item.arr}</div>
          </div>
          <div style="text-align: right;">
            <div class="bus-dest">${item.stop === 'sd' ? 'San Demetrio' : 'San Panfilo'}</div>
            <div class="bus-sub">Linea ${item.line} • ${item.note}</div>
            <span class="tag">${item.val}</span>
          </div>
        </div>
      `).join('');
    }

    function setDirection(dir) {
      currentDir = dir;
      document.getElementById('tab-andata').classList.toggle('active', dir === 'andata');
      document.getElementById('tab-ritorno').classList.toggle('active', dir === 'ritorno');
      renderList();
    }

    function setFilter(filter, el) {
      currentFilter = filter;
      document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
      el.classList.add('active');
      renderList();
    }

    // --- 2. MAPPA INTERATTIVA LEAFLET ---
    const map = L.map('map').setView([42.3150, 13.4850], 11);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap'
    }).addTo(map);

    const STOPS = [
      { name: "L'Aquila Terminal", lat: 42.3480, lon: 13.3980 },
      { name: "San Demetrio Uff. Postale", lat: 42.2905, lon: 13.5855 },
      { name: "San Panfilo d'Ocre", lat: 42.2882, lon: 13.6015 }
    ];

    STOPS.forEach(s => {
      L.marker([s.lat, s.lon]).addTo(map).bindPopup(`<b>${s.name}</b>`);
    });

    let userMarker = null;

    // --- 3. GEOLOCALIZZAZIONE ED ALLERTA GPS ---
    let watchId = null;

    function toggleGPSAlert() {
      const btn = document.getElementById('alertBtn');
      const status = document.getElementById('gps-status');

      if (watchId !== null) {
        navigator.geolocation.clearWatch(watchId);
        watchId = null;
        btn.classList.remove('active');
        btn.innerText = "🔔 Attiva Allarme Arrivo (San Demetrio / San Panfilo)";
        status.innerText = "GPS disattivato";
        if(userMarker) map.removeLayer(userMarker);
        return;
      }

      if ("Notification" in window && Notification.permission !== "granted") {
        Notification.requestPermission();
      }

      if ("geolocation" in navigator) {
        btn.classList.add('active');
        btn.innerText = "🛑 Disattiva Allarme GPS";
        status.innerText = "GPS attivo: localizzazione in corso...";

        watchId = navigator.geolocation.watchPosition(
          position => {
            const lat = position.coords.latitude;
            const lon = position.coords.longitude;

            if(!userMarker) {
              userMarker = L.circleMarker([lat, lon], { color: 'red', radius: 8 }).addTo(map);
            } else {
              userMarker.setLatLng([lat, lon]);
            }

            STOPS.slice(1).forEach(stop => {
              const distance = getDistanceMetres(lat, lon, stop.lat, stop.lon);
              if (distance < 500) {
                status.innerText = `⚠️ In arrivo a ${stop.name} (${Math.round(distance)}m)`;
                triggerArrivalNotification(stop.name);
              } else {
                status.innerText = `GPS attivo - Distanza da ${stop.name}: ${Math.round(distance)}m`;
              }
            });
          },
          error => { status.innerText = "Errore lettura GPS."; },
          { enableHighAccuracy: true }
        );
      }
    }

    function getDistanceMetres(lat1, lon1, lat2, lon2) {
      const R = 6371e3;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat/2)*Math.sin(dLat/2) + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)*Math.sin(dLon/2);
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    function triggerArrivalNotification(stopName) {
      if ("vibrate" in navigator) navigator.vibrate([500, 200, 500]);
      if ("Notification" in window && Notification.permission === "granted") {
        new Notification("⚠️ Sei in arrivo!", { body: `Prossima fermata: ${stopName}` });
      }
    }

    // --- 4. FEED RSS TUA ---
    async function checkTUANews() {
      try {
        const res = await fetch(`https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent('https://www.tuabruzzo.it/rss.xml')}`);
        const data = await res.json();
        if (data.status === 'ok') {
          const kw = ["aquila", "demetrio", "panfilo", "ocre", "2001", "2007"];
          const item = data.items.find(i => kw.some(k => (i.title + i.description).toLowerCase().includes(k)));
          if (item) {
            document.getElementById('rss-content').innerHTML = `<strong>${item.title}</strong><br>${item.description.substring(0, 100)}...`;
            document.getElementById('rss-banner').style.display = 'block';
          }
        }
      } catch (e) {}
    }

    renderList();
    checkTUANews();
  </script>
</body>
</html>
